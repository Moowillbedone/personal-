name: stock-tracker / pullback-intraday

# 15분봉 눌림목 스캐너 — recomputes the dashboard pullback verdict every ~15 min
# during the US session (pre-market included). Long-running-loop pattern (like
# poll): each launch loops internally every 15 min for ~5h20m, and launches
# overlap so the effective cadence survives GitHub Actions cron drift. Public
# repo ⇒ unlimited Actions minutes. Idempotent (upsert), separate from poll so
# the signal poll is unaffected.
on:
  schedule:
    # GH Actions scheduled cron is BEST-EFFORT — the top-of-hour slot is heavily
    # congested and a launch can be delayed 30min~3h+ or skipped. So (like poll)
    # fire every 2h and rely on the 5h20m loops OVERLAPPING: even if one launch
    # is very late, an adjacent one already covers the window. Start at 06:00 UTC
    # (2h before pre-market 08:00 UTC / KST 17:00) so a loop is already running
    # when the session opens; the 22:00 launch's tail covers after-hours to
    # ~03:20 UTC. Concurrent overlapping loops are idempotent (upsert).
    - cron: "0 6,8,10,12,14,16,18,20,22 * * 1-5"
  workflow_dispatch:
    inputs:
      loop_min:
        description: "Loop minutes (0 = single-shot)"
        default: "0"
        required: false

permissions:
  contents: read

jobs:
  pullback-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: stock-tracker/worker
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
      ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
      LOOP_MIN: ${{ github.event_name == 'schedule' && '320' || (inputs.loop_min || '0') }}
      LOOP_INTERVAL_SEC: "900"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: stock-tracker/worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python pullback_intraday.py
