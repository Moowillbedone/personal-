name: stock-tracker / correctness checks
on:
  pull_request:
    paths: ["stock-tracker/**", ".github/workflows/stock-tracker-checks.yml"]
  push:
    branches: [main]
    paths: ["stock-tracker/**", ".github/workflows/stock-tracker-checks.yml"]
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-tracker/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: stock-tracker/apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock-tracker/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: stock-tracker/worker/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
