<header class="tb">
  <div class="tb-brand"><i></i>브레인180 관리자 프로토타입 <small>설계서 v0.1 기반, 검토 반영</small></div>
  <div class="tb-group">
    <div class="seg" id="modeSeg" role="group" aria-label="보기 방식"><button data-mode="free" class="on">자유 탐색</button><button data-mode="demo">데모 가이드</button></div>
    <label class="sr" for="personaSel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">사람 선택</label>
    <select id="personaSel" title="누구의 화면으로 볼지 골라요"></select>
    <div class="seg" id="deviceSeg" role="group" aria-label="기기"><button data-device="pc">PC</button><button data-device="tablet">태블릿</button><button data-device="kiosk">키오스크</button><button data-device="mobile">휴대폰</button></div>
    <button class="tb-btn" id="introBtn" title="처음 보는 분을 위한 안내 화면으로 가요">처음 안내</button>
    <button class="tb-btn on" id="pinBtn" title="화면의 번호 표시를 켜고 꺼요">번호 표시</button>
  </div>
  <div class="tour">
    <div class="tour-label" id="tourLabel"></div>
    <div class="tour-bar" aria-hidden="true"><i id="tourBar"></i></div>
    <button id="prevBtn">‹ 이전</button>
    <button class="primary" id="nextBtn">다음 ›</button>
  </div>
</header>
<div class="stage">
  <div class="view">
    <div class="view-meta" id="viewMeta"></div>
    <div class="fit" id="fit"><div class="fit-inner" id="fitInner">
      <div class="device pc" id="device">
        <div class="browser-bar" id="browserBar"><i></i><i></i><i></i><div class="url" id="browserUrl"></div></div>
        <div class="app" id="app"></div>
      </div>
    </div></div>
  </div>
  <aside class="prd" id="prd" aria-label="동적 PRD"></aside>
</div>
